<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Cream</title>
    <link rel="stylesheet" href="styles/ice-cream-styles.css">
    <link rel="icon" href="images/images.png">
    <script src="js/ice-cream.js" defer></script>
</head>
<body>
    <div id="main">
        <div id="header">
             <h1>Ice Cream Order Form</h1>
             
        </div>
        <form id="ice-cream-form" action="#" method="get">

        <!-- Name Info -->

        <fieldset>
            <legend>Personal Information</legend>
            <span class="err" id="err-name">Name is required</span>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name">

            <span class="err" id="err-email">Email is required</span>
            <span class ="err" id="err-emailsign">@ is required</span>
            <label for="email">Email:</label>
            <input type="text" id="email" name="email">
        </fieldset>

        <!-- Order details -->
         <fieldset>
            <legend>Order Details</legend>


            <label>Choose your flavor:<label>
                <span class = "err" id="err-flavor">Please select a flavor</span>
            <select id="flavor" name="flavor">
                <option value="none"> --Select a Flavor-- </option>
                <option value="Vanilla">Vanilla</option>
                <option value="Chocolate">Chocolate</option>
                <option value="Strawberry">Strawberry</option>
            </select>
        <br>
        <br>
            <label>Choose your cone:</label>
            <span class="err" id="err-method"> Please select a cone</span>
            <label for="waffle-cone">
                <input type="radio" id="waffle-cone" name="method" value="waffle-cone">
                Waffle Cone
            </label>
      
             <label for="sugar-cone">
                <input type="radio" id="sugar-cone" name="method" value="sugar-cone">
                Sugar Cone
            </label>

             <label for="cup">
                <input type="radio" id="cup" name="method" value="cup">
                Cup
            </label>
<br>
            <label>Toppings:</label>
             <label for="sprinkles">
                <input type="checkbox" id="sprinkles" 
                    name="toppings[]" value="sprinkles">
                    Sprinkles
            </label>

            <label for="nuts">
                <input type="checkbox" id="nuts" 
                    name="toppings[]" value="nuts">
                   Nuts
            </label>

            <label for="cherry">
                <input type="checkbox" id="cherry" 
                    name="toppings[]" value="cherry">
                  Cherry
            </label>

             <label for="whipped-cream">
                <input type="checkbox" id="whipped-cream" 
                    name="toppings[]" value="cwhipped-cream">
                  Whipped Cream
            </label>
<br>
             <!-- Comment field -->
                 <label for="comment">Additional comments</label>
                 <textarea rows="5" id="comment" name="comment"></textarea>
                 
         </fieldset>

          

         <!-- Order Button -->
                <button type ="submit" id="order-button">Submit Order</button>
         </form>
    </div>
   

</body>
</html>
